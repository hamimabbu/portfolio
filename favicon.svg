<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Terminal prompt icon">
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#0e100f" stroke="#2b312d" stroke-width="3"/>
  <!-- the ">" of a terminal prompt -->
  <path d="M18 22 L32 32 L18 42" fill="none" stroke="#7bd88f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the underscore cursor -->
